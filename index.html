<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EXPERIENCIAS · Invitaciones digitales</title>

    <link rel="stylesheet" href="./assets/carousel/index.css" />
  </head>

  <body>
    <main class="experience-world">
      <!-- =====================================================
           FONDO AMBIENTAL
      ====================================================== -->

      <div class="ambient ambient-1"></div>
      <div class="ambient ambient-2"></div>
      <div class="ambient ambient-3"></div>

      <!-- =====================================================
           HEADER
      ====================================================== -->

      <header class="experience-header">
        <div class="brand">
          <span class="brand-small"> INVITACIONES DIGITALES </span>

          <span class="brand-name"> EXPERIENCIAS </span>
        </div>

        <div class="header-line"></div>

        <div class="header-number">
          <span id="headerCurrent">01</span>

          <span class="slash">/</span>

          <span id="headerTotal">11</span>
        </div>
      </header>

      <!-- =====================================================
           HERO
      ====================================================== -->

      <section class="hero">
        <div class="hero-content">
          <h1 id="heroTitle">
            Tu invitación
            <em>es única.</em>
          </h1>

          <div id="hero-line" class="hero-line"></div>

          <p id="heroPhrase">
            <em>Tu historia también</em>
            <span>merece una invitación única.</span>
          </p>
        </div>

        <!-- ===================================================
       EXPERIENCIA / CARRUSEL
  ==================================================== -->

        <div class="world-loader" id="worldLoader">
          <div class="world-loader-inner">
            <div class="world-loader-number" id="worldLoaderNumber">01</div>
            <div class="world-loader-line"></div>
            <div class="world-loader-text" id="worldLoaderText">CARGANDO</div>
          </div>
        </div>

        <div class="experience-carousel">
          <!-- Flecha izquierda -->

          <button
            class="carousel-arrow carousel-prev"
            id="prevExperience"
            aria-label="Experiencia anterior"
          >
            ←
          </button>

          <!-- Tarjeta lateral izquierda -->

          <div class="side-card side-card-left" id="sideLeft">
            <img id="sideLeftImage" src="" alt="" />

            <div class="side-overlay"></div>

            <div class="side-info">
              <span id="sideLeftNumber"> 11 </span>

              <span id="sideLeftTitle"> Otro evento </span>
            </div>
          </div>

          <!-- Tarjeta lateral derecha -->

          <div class="side-card side-card-right" id="sideRight">
            <img id="sideRightImage" src="" alt="" />

            <div class="side-overlay"></div>

            <div class="side-info">
              <span id="sideRightNumber"> 02 </span>

              <span id="sideRightTitle"> Cumple 8 </span>
            </div>
          </div>

          <!-- =================================================
               EXPERIENCIA PRINCIPAL
          ================================================== -->

          <article class="main-experience" id="mainExperience">
            <div class="particle-layer"></div>

            <div class="main-image-wrapper">
              <img id="mainImage" class="main-image" src="" alt="" />

              <img id="mainImageHover" class="main-image-hover" src="" alt="" />

              <div class="main-image-overlay"></div>

              <div class="main-image-glow"></div>
            </div>

            <div class="main-content">
              <div class="experience-category">EXPERIENCIA</div>

              <h2 id="mainTitle">Casamiento</h2>

              <div class="title-line"></div>

              <p id="mainPhrase">Se renueva una historia.</p>

              <button class="experience-button" id="openExperience">
                <span> Vivir esta experiencia </span>

                <strong> → </strong>
              </button>
            </div>
          </article>

          <!-- Flecha derecha -->

          <button
            class="carousel-arrow carousel-next"
            id="nextExperience"
            aria-label="Siguiente experiencia"
          >
            →
          </button>
        </div>
      </section>

      <!-- =====================================================
           CTA
      ====================================================== -->

      <!-- =====================================================
           FOOTER
      ====================================================== -->

      <footer class="experience-footer">
        <div class="progress">
          <span class="progress-number" id="progressCurrent"> 01 </span>

          <div class="progress-line">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <span class="progress-number"> 11 </span>
        </div>

        <div class="footer-hint">Deslizá · explorá · elegí</div>
      </footer>
    </main>

    <script src="./assets/carousel/index.js"></script>
  </body>
</html>
