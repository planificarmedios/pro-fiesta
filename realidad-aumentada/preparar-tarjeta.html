<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparar tarjeta AR · Pro-Fiesta</title><style>body{margin:0;background:#17251a;color:#f8f3e8;font:16px system-ui;padding:24px}main{max-width:680px;margin:auto}h1{font:2.5rem Georgia,serif}p{line-height:1.6;color:#dce3d4}button{background:#efd99b;color:#17251a;border:0;border-radius:99px;padding:14px 20px;font-weight:800;font-size:1rem}#status{white-space:pre-wrap}</style></head><body><main><div>✳ PRO-FIESTA · HERRAMIENTA DE PREPARACIÓN</div><h1>Preparar tarjeta</h1><p>Seleccioná el archivo <b>tarjeta-dino.jpg</b> (la misma imagen de la carpeta assets) para generar el archivo que permite reconocerla con la cámara.</p><input type="file" id="file" accept="image/*"><p><button id="go">Generar archivo tarjeta.mind</button></p><p id="status">El proceso se realiza en tu navegador.</p></main><script type="module">import {Compiler} from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';const file=document.querySelector('#file'),btn=document.querySelector('#go'),status=document.querySelector('#status');btn.onclick=async()=>{if(!file.files[0]){status.textContent='Primero seleccioná tarjeta-dino.jpg.';return}btn.disabled=true;try{const img=new Image();img.src=URL.createObjectURL(file.files[0]);await img.decode();const compiler=new Compiler();await compiler.compileImageTargets([img],p=>status.textContent='Analizando la tarjeta: '+Math.round(p*100)+'%');const data=await compiler.exportData();const url=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download='tarjeta.mind';a.click();URL.revokeObjectURL(url);status.textContent='¡Listo! Subí tarjeta.mind a la carpeta realidad-aumentada/assets/ en GitHub.'}catch(e){console.error(e);status.textContent='No se pudo compilar. Probá con Chrome o Edge actualizado.'}btn.disabled=false};</script></body></html>
